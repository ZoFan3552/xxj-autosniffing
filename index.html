<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XXJ Auto Sniffing</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0a0c10;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background:
          radial-gradient(110% 90% at 50% 8%, rgba(59, 130, 246, 0.22), transparent 65%),
          linear-gradient(150deg, #0a0c10 0%, #121826 100%);
        color: #e2e8f0;
        font-family: "DM Sans", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        letter-spacing: 0.1px;
        transition: opacity 220ms ease, transform 220ms ease;
      }

      #boot-splash.boot-splash-leave {
        opacity: 0;
        transform: scale(1.01);
        pointer-events: none;
      }

      .boot-logo {
        font-family: "JetBrains Mono", "Cascadia Code", "Consolas", monospace;
        font-size: 24px;
        font-weight: 700;
        color: #93c5fd;
        text-shadow: 0 0 18px rgba(59, 130, 246, 0.35);
      }

      .boot-loading-line {
        position: relative;
        width: 220px;
        height: 4px;
        border-radius: 99px;
        overflow: hidden;
        background: rgba(148, 163, 184, 0.15);
      }

      .boot-loading-line::before {
        content: "";
        position: absolute;
        left: -40%;
        top: 0;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, rgba(59, 130, 246, 0), #60a5fa, rgba(59, 130, 246, 0));
        animation: boot-scan 1.25s ease-in-out infinite;
      }

      .boot-text {
        font-size: 12px;
        color: #94a3b8;
      }

      @keyframes boot-scan {
        0% {
          left: -40%;
        }
        100% {
          left: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div id="boot-splash" role="status" aria-live="polite" aria-label="应用正在启动">
      <div class="boot-logo">XXJ-SNIFF</div>
      <div class="boot-loading-line" aria-hidden="true"></div>
      <div class="boot-text">正在启动抓包面板...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
