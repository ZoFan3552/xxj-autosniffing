<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>XXJ Auto Sniffing</title>
    <style>
      :root {
        color-scheme: light;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #FFFBFE;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #FFFBFE;
        color: #1C1B1F;
        font-family: "Roboto", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        letter-spacing: 0.1px;
        transition: opacity 220ms ease, transform 220ms ease;
      }

      #boot-splash.boot-splash-leave {
        opacity: 0;
        transform: scale(1.01);
        pointer-events: none;
      }

      .boot-logo {
        font-family: "Roboto", sans-serif;
        font-size: 24px;
        font-weight: 600;
        color: #6750A4;
      }

      .boot-loading-line {
        position: relative;
        width: 220px;
        height: 4px;
        border-radius: 99px;
        overflow: hidden;
        background: #E8DEF8;
      }

      .boot-loading-line::before {
        content: "";
        position: absolute;
        left: -40%;
        top: 0;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, rgba(103,80,164,0), #6750A4, rgba(103,80,164,0));
        animation: boot-scan 1.25s ease-in-out infinite;
      }

      .boot-text {
        font-size: 13px;
        color: #79747E;
      }

      @keyframes boot-scan {
        0% {
          left: -40%;
        }
        100% {
          left: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div id="boot-splash" role="status" aria-live="polite" aria-label="应用正在启动">
      <div class="boot-logo">XXJ-SNIFF</div>
      <div class="boot-loading-line" aria-hidden="true"></div>
      <div class="boot-text">正在启动抓包面板...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
